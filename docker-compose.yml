# ==============================================================================
# CASETHREAD SYSTEM ORCHESTRATION DOCKER COMPOSE
# Hardened multi-container architecture for forensic investigation workflows
# ==============================================================================

version: '3.8'

services:
  database:
    image: mysql:8.0
    container_name: casethread-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-casethread_db}
      MYSQL_USER: ${DB_USER:-casethread_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    # Bind only to localhost loopback interface to prevent unauthorized external network exposure
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    networks:
      - casethread-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: casethread-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-5000}:5000"
    environment:
      NODE_ENV: production
      PORT: ${PORT:-5000}
      DB_HOST: database
      DB_PORT: 3306
      DB_USER: ${DB_USER:-casethread_user}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-casethread_db}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      C_ENGINE_TIMEOUT_MS: ${C_ENGINE_TIMEOUT_MS:-8000}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:3000}
      EVIDENCE_VAULT_PATH: /app/storage/vault
      KNOWLEDGE_VAULT_PATH: /app/storage/private_knowledge_vault
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-50}
      INGESTION_WORKER_ENABLED: ${INGESTION_WORKER_ENABLED:-true}
      METRICS_ENABLED: "true"
    volumes:
      - evidence_vault:/app/storage/vault
      - knowledge_vault:/app/storage/private_knowledge_vault
    networks:
      - casethread-net
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/v1/health/liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: casethread-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - casethread-net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  db_data:
    driver: local
  evidence_vault:
    driver: local
  knowledge_vault:
    driver: local

networks:
  casethread-net:
    driver: bridge
